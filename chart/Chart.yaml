apiVersion: v2
name: postgrest-over-pgmq
description: A Helm chart for PostgREST over PGMQ

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "1.5.0-pg17-deb12"

dependencies:
  # Chart:     https://github.com/bitnami/charts/tree/main/bitnami/postgresql
  # Container: https://github.com/bitnami/containers/tree/main/bitnami/postgresql
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 16.2.1
    condition: postgresql.enabled,global.postgresql.enabled

  # Chart:     https://github.com/bitnami/charts/tree/main/bitnami/keycloak
  # Container: https://github.com/bitnami/containers/tree/main/bitnami/keycloak
  - name: keycloak
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 24.2.1
    condition: keycloak.enabled,global.keycloak.enabled

  # Chart:     https://github.com/bitnami/charts/tree/main/bitnami/minio
  # Container: https://github.com/bitnami/containers/tree/main/bitnami/minio
  - name: minio
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 14.8.5
    condition: minio.enabled,global.minio.enabled

  # Chart:     https://github.com/bitnami/charts/tree/main/bitnami/rabbitmq
  # Container: https://github.com/bitnami/containers/tree/main/bitnami/rabbitmq
  - name: rabbitmq
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 15.0.6
    condition: rabbitmq.enabled,global.rabbitmq.enabled
